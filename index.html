<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cast of Characters</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome: paste your Kit's CSS-only embed code here (Kit settings > Embed method: CSS, Font Awesome 6, web fonts) -->
  <link rel="stylesheet" href="https://kit.fontawesome.com/YOUR_KIT_CODE.css" crossorigin="anonymous">
  <script src="flags.js" defer></script>
  <script src="characters.js" defer></script>
  <script src="card.js" defer></script>
  <script src="script.js" defer></script>
  <!-- Without JS the filter panel can't work, so hide it -->
  <noscript><style>#sidebar{display:none}</style></noscript>
<style>
@import url('https://fonts.googleapis.com/css2?family=Contrail+One&display=swap');
@font-face { font-family: "big noodle"; src: url('//glen-assets.github.io/fonts/big_noodle_titling_oblique.ttf'); }
@font-face { font-family: "motor oil"; src: url('//glen-assets.github.io/fonts/Motor Oil 1937 M54.ttf'); }
</style>
</head>
<body>
<!--
  HOW THIS PAGE WORKS
  Characters live in characters.js (edit with the editor, or by hand). card.js builds the cards from
  that data (sorted by name) and script.js adds the sidebar filters and version buttons.
  Scripts run in this order: flags.js (flag designs), characters.js (the cast), card.js (card layout), script.js.
  Card layout: edit FIELDS in card.js and the CSS in style.css.
  Tags: "category: value value; category: value" (hyphens for multi-word values, shown as "Space station").
-->

<!-- ===== HEADER (customize) ===== -->
<header id="site-header">
  <h1>Cast of Characters</h1>
  <p>Pick tags in the sidebar to narrow the cast. Characters must match every tag you pick.</p>
</header>

<div id="layout">

  <!-- ===== SIDEBAR (auto-filled by script.js) ===== -->
  <aside id="sidebar">
    <details id="drawer" open>
      <summary>Filters</summary>
      <button id="clear-filters" type="button" disabled>Clear filters</button>
      <div id="filters"></div>
    </details>
  </aside>

  <!-- ===== MAIN ===== -->
  <main id="main">

    <!-- ===== CHARACTER GRID (flexbox) ===== -->
    <div id="grid"><noscript>This page needs JavaScript to show the cast.</noscript></div>

    <!-- ===== EMPTY STATE (shown when no character matches) ===== -->
    <p id="empty-state" role="status" hidden>
      No characters match these filters. Picking two tags from the same category only shows characters that have both.
    </p>
  </main>
</div>

<!-- ===== FOOTER (customize) ===== -->
<footer id="site-footer">
  <p>Made with care.</p>
</footer>

</body>
</html>
